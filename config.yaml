# Weekly speech paper digest — all tunables live here.

lookback_days: 7          # crawl window for time-based sources
top_k: 10                 # items in the digest
shortlist_size: 30        # candidates that get full 5-criteria scoring
language: "tiếng Việt (giữ nguyên thuật ngữ kỹ thuật tiếng Anh)"

models:
  triage: gemini-3.5-flash-lite   # cheap relevance filter on title/abstract
  score: gemini-3.8-flash         # 5-criteria scoring
  summarize: gemini-3.8-flash     # full-text detailed summary

# Relative weights; total score = weighted mean scaled to 0-100.
weights:
  novelty: 25
  technical: 20
  evidence: 20
  impact: 20
  credibility: 15

# Topic scope handed to the LLM. Anything outside is dropped.
topics:
  ASR: "automatic speech recognition, speech-to-text, multilingual/low-resource ASR, streaming ASR, diarization as part of transcription"
  TTS: "text-to-speech, speech synthesis, voice cloning, vocoders, expressive/zero-shot TTS, speech codecs for generation"
  Speech Understanding: "spoken language understanding, speech LLMs / audio-language models, speech translation, emotion/paralinguistics, spoken QA"
  Voice Agent: "voice assistants and agents, full-duplex spoken dialogue, speech-to-speech models, real-time voice pipelines, turn-taking"

# Cheap regex prefilter (case-insensitive, word-bounded) for broad sources.
keywords:
  - speech
  - spoken
  - voice
  - asr
  - tts
  - text-to-speech
  - speech-to-text
  - speech-to-speech
  - transcription
  - speaker
  - vocoder
  - prosody
  - phoneme
  - whisper
  - diarization
  - full-duplex
  - audio language model
  - audio llm
  - audio-language
  - turn-taking

sources:
  arxiv:
    enabled: true
    # Everything from these categories...
    categories: [eess.AS, cs.SD]
    # ...plus speech-keyword matches from these.
    keyword_categories: [cs.CL, cs.AI, cs.LG]
    max_results: 1500
  hf_papers:
    enabled: true
  hf_models:
    enabled: true
    pipeline_tags: [automatic-speech-recognition, text-to-speech, audio-text-to-text, audio-to-audio]
    per_tag: 20
    min_likes: 20
    created_within_days: 30
  github:
    enabled: true
    topics: [speech-recognition, asr, speech-to-text, text-to-speech, tts, speech-synthesis, voice-cloning, voice-agent, voice-assistant, spoken-language-understanding, speech-llm]
    min_stars: 50
    created_within_days: 30
  rss:
    enabled: true
    feeds:
      Hugging Face Blog: https://huggingface.co/blog/feed.xml
      Google Research: https://research.google/blog/rss/
      Google DeepMind: https://deepmind.google/blog/rss.xml
      OpenAI: https://openai.com/news/rss.xml
      Microsoft Research: https://www.microsoft.com/en-us/research/feed/
      NVIDIA Developer: https://developer.nvidia.com/blog/feed
      AWS Machine Learning: https://aws.amazon.com/blogs/machine-learning/feed/
      Apple Machine Learning: https://machinelearning.apple.com/rss.xml
      Daily (Pipecat): https://www.daily.co/blog/rss/
  isca:
    enabled: true
    # Volumes appear once per conference; each unseen volume is scanned once.
    # Keyword-matched titles per scan (abstract page fetched for each). High enough to cover
    # a whole Interspeech volume, so selection is left to LLM triage, not archive order.
    max_candidates: 1500
